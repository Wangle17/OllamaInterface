<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .header-title {
      font-size: 13px;
      color: #4ade80;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .header-server {
      font-size: 11px;
      color: #374151;
      letter-spacing: 0.05em;
    }
    .header-server span { color: #22d3ee; }

    .term-window {
      background: #0d0d0d;
      border-radius: 10px;
      border: 1px solid #1e1e1e;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 78vh;
      min-height: 480px;
    }

    /* title bar */
    .term-bar {
      background: #161616;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }
    .term-bar-title {
      font-size: 11px;
      color: #3f3f3f;
      letter-spacing: 0.08em;
      margin: 0 auto;
    }

    /* model selector in title bar */
    .model-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .model-select-label {
      font-size: 10px;
      color: #374151;
      letter-spacing: 0.06em;
    }
    #model-select {
      appearance: none;
      -webkit-appearance: none;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #c084fc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 3px 22px 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.15s;
    }
    #model-select:hover { border-color: #c084fc; }
    #model-select:focus { border-color: #c084fc; }
    .model-select-arrow {
      pointer-events: none;
      position: absolute;
      right: 7px;
      color: #374151;
      font-size: 9px;
    }

    /* boot lines */
    .boot-section {
      padding: 18px 24px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid #141414;
    }
    .boot-line {
      font-size: 12px;
      line-height: 1.8;
      color: #2d4a3e;
    }
    .boot-line .ok  { color: #4ade80; }
    .boot-line .info { color: #22d3ee; }
    .boot-line .dim  { color: #1f2937; }
    .boot-line .warn { color: #fbbf24; }

    /* chat log */
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }
    .chat-log::-webkit-scrollbar { width: 4px; }
    .chat-log::-webkit-scrollbar-track { background: transparent; }
    .chat-log::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 2px; }

    /* messages */
    .msg-block { margin-bottom: 4px; }
    .msg-prompt-line { font-size: 13px; line-height: 1.6; color: #4ade80; }
    .msg-prompt-line .sym { color: #22d3ee; }
    .msg-prompt-line .cmd { color: #f1f5f9; }
    .msg-model-tag {
      font-size: 10px;
      color: #374151;
      margin-left: 18px;
      letter-spacing: 0.05em;
    }

    .msg-response {
      padding: 2px 0 10px 16px;
      border-left: 1px solid #1a2e1a;
      margin-left: 6px;
      margin-top: 4px;
    }
    .msg-response-line {
      font-size: 13px;
      line-height: 1.75;
      color: #7a8a9a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-error-line {
      font-size: 13px;
      line-height: 1.75;
      color: #f87171;
    }

    .divider {
      border: none;
      border-top: 1px solid #141414;
      margin: 10px 0;
    }

    /* thinking */
    .thinking {
      font-size: 12px;
      color: #374151;
      padding: 6px 0 10px 16px;
      border-left: 1px solid #1a2e1a;
      margin-left: 6px;
    }
    .dot-pulse { display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:1} }

    /* status */
    .status-bar { padding: 6px 24px; min-height: 26px; flex-shrink: 0; }
    #status { font-size: 11px; color: #854d0e; letter-spacing: 0.04em; }
    #status.sending { color: #fbbf24; }
    #status.error   { color: #f87171; }

    /* input row */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px 16px;
      border-top: 1px solid #161616;
      flex-shrink: 0;
    }
    .input-sym { color: #22d3ee; font-size: 14px; flex-shrink: 0; }
    #prompt {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      caret-color: #22d3ee;
    }
    #prompt::placeholder { color: #1f2937; }

    .send-btn {
      background: transparent;
      border: 1px solid #1e2e1e;
      color: #4ade80;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover  { background: #0f1f0f; border-color: #4ade80; }
    .send-btn:active { transform: scale(0.97); }

    .cursor {
      display: inline-block;
      width: 7px; height: 13px;
      background: #22d3ee;
      animation: blink 1.1s step-end infinite;
      vertical-align: -2px;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <span class="header-title">// ollama chat interface</span>
      <span class="header-server">server: <span>192.168.86.241:11434</span></span>
    </div>

    <div class="term-window">

      <!-- title bar with model dropdown -->
      <div class="term-bar">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <span class="term-bar-title" id="bar-title">ollama — local</span>
        <div class="model-select-wrap">
          <span class="model-select-label">model:</span>
          <select id="model-select"></select>
          <span class="model-select-arrow">▾</span>
        </div>
      </div>

      <!-- boot lines -->
      <div class="boot-section">
        <div class="boot-line"><span class="ok">[  OK  ]</span> Connected to ollama server</div>
        <div class="boot-line" id="boot-model-line"><span class="ok">[  OK  ]</span> Model <span class="info" id="boot-model-name">—</span> ready</div>
        <div class="boot-line"><span class="dim">[------]</span> Session started: <span id="session-ts" class="dim"></span></div>
      </div>

      <!-- chat messages -->
      <div class="chat-log" id="chat"></div>

      <!-- status -->
      <div class="status-bar"><span id="status"></span></div>

      <!-- input -->
      <div class="input-row">
        <span class="input-sym">❯</span>
        <input type="text" id="prompt" placeholder="ask anything..." autocomplete="off" spellcheck="false" />
        <button class="send-btn" onclick="sendMessage()">SEND ↗</button>
      </div>

    </div>
  </div>

  <!-- model definitions -->
  <script src="models.js"></script>

  <script>
    const SERVER = "http://192.168.86.241:11434";

    // ── populate dropdown from models.js ────────────────────────────────────
    const selectEl = document.getElementById('model-select');

    OLLAMA_MODELS.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label;
      if (m.id === DEFAULT_MODEL) opt.selected = true;
      selectEl.appendChild(opt);
    });

    function getSelectedModel() {
      return selectEl.value;
    }

    function getSelectedLabel() {
      const found = OLLAMA_MODELS.find(m => m.id === selectEl.value);
      return found ? found.label : selectEl.value;
    }

    // update boot line + title bar when model changes
    function updateModelUI() {
      const label = getSelectedLabel();
      document.getElementById('boot-model-name').textContent = label;
      document.getElementById('bar-title').textContent = `ollama — ${label.toLowerCase()} — local`;
    }

    selectEl.addEventListener('change', () => {
      updateModelUI();
      addSystemLine(`model switched → ${getSelectedLabel()}`);
    });

    // init
    document.getElementById('session-ts').textContent =
      new Date().toLocaleString('en-AU', { hour12: false });
    updateModelUI();

    // ── helpers ─────────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function addSystemLine(text) {
      const chat = document.getElementById('chat');
      const el = document.createElement('div');
      el.className = 'boot-line';
      el.style.cssText = 'font-size:11px;margin:6px 0;';
      el.innerHTML = `<span class="warn">[  --  ]</span> ${escHtml(text)}`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, content) {
      const chat = document.getElementById('chat');

      if (role === 'user') {
        const block = document.createElement('div');
        block.className = 'msg-block';
        block.innerHTML = `
          <div class="msg-prompt-line">
            <span class="sym">❯ </span><span class="cmd">${escHtml(content)}</span>
          </div>
          <div class="msg-model-tag">${escHtml(getSelectedLabel())}</div>`;
        chat.appendChild(block);
      } else {
        const responseDiv = document.createElement('div');
        responseDiv.className = 'msg-response';

        String(content).split('\n').forEach(rawLine => {
          const lineEl = document.createElement('div');
          if (!rawLine.trim()) {
            lineEl.style.height = '6px';
          } else {
            lineEl.className = role === 'error' ? 'msg-error-line' : 'msg-response-line';
            lineEl.textContent = rawLine;
          }
          responseDiv.appendChild(lineEl);
        });

        chat.appendChild(responseDiv);
        const div = document.createElement('hr');
        div.className = 'divider';
        chat.appendChild(div);
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function addThinking() {
      const chat = document.getElementById('chat');
      const el = document.createElement('div');
      el.className = 'thinking';
      el.id = 'thinking-indicator';
      el.innerHTML = `<span class="dot-pulse">processing</span> <span class="cursor"></span>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
      const el = document.getElementById('thinking-indicator');
      if (el) el.remove();
    }

    // ── send message ─────────────────────────────────────────────────────────
    async function sendMessage() {
      const promptEl = document.getElementById('prompt');
      const statusEl = document.getElementById('status');
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      const model = getSelectedModel();
      promptEl.value = '';
      addMessage('user', prompt);
      addThinking();

      statusEl.className = 'sending';
      statusEl.textContent = `transmitting → ${getSelectedLabel()}...`;

      try {
        const res = await fetch(`${SERVER}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            messages: [{ role: "user", content: prompt }],
            stream: false
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        removeThinking();
        statusEl.textContent = '';
        statusEl.className = '';
        addMessage('assistant', data.message?.content || "No response.");
      } catch (err) {
        removeThinking();
        statusEl.className = 'error';
        statusEl.textContent = `error: ${err.message}`;
        addMessage('error', `✗ ${err.message}`);
      }
    }

    document.getElementById('prompt').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
