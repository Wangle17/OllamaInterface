<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    /* header above terminal */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .header-title {
      font-size: 13px;
      color: #4ade80;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .header-server {
      font-size: 11px;
      color: #374151;
      letter-spacing: 0.05em;
    }
    .header-server span {
      color: #22d3ee;
    }

    /* terminal window */
    .term-window {
      background: #0d0d0d;
      border-radius: 10px;
      border: 1px solid #1e1e1e;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 78vh;
      min-height: 480px;
    }

    /* title bar */
    .term-bar {
      background: #161616;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }
    .term-bar-title {
      font-size: 11px;
      color: #3f3f3f;
      letter-spacing: 0.08em;
      margin: 0 auto;
    }
    .term-bar-model {
      font-size: 11px;
      color: #c084fc;
      letter-spacing: 0.05em;
    }

    /* boot lines */
    .boot-section {
      padding: 18px 24px 0;
      flex-shrink: 0;
      border-bottom: 1px solid #141414;
      padding-bottom: 14px;
    }
    .boot-line {
      font-size: 12px;
      line-height: 1.8;
      color: #2d4a3e;
    }
    .boot-line .ok { color: #4ade80; }
    .boot-line .info { color: #22d3ee; }
    .boot-line .dim { color: #1f2937; }

    /* chat log */
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }
    .chat-log::-webkit-scrollbar { width: 4px; }
    .chat-log::-webkit-scrollbar-track { background: transparent; }
    .chat-log::-webkit-scrollbar-thumb { background: #1e1e1e; border-radius: 2px; }

    /* message blocks */
    .msg-block { margin-bottom: 4px; }
    .msg-prompt-line {
      font-size: 13px;
      line-height: 1.6;
      color: #4ade80;
    }
    .msg-prompt-line .sym { color: #22d3ee; }
    .msg-prompt-line .cmd { color: #f1f5f9; }

    .msg-response {
      padding: 2px 0 10px 16px;
      border-left: 1px solid #1a2e1a;
      margin-left: 6px;
      margin-top: 4px;
    }
    .msg-response-line {
      font-size: 13px;
      line-height: 1.75;
      color: #7a8a9a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-response-line .accent { color: #c084fc; }

    .msg-error-line {
      font-size: 13px;
      line-height: 1.75;
      color: #f87171;
    }

    .divider {
      border: none;
      border-top: 1px solid #141414;
      margin: 10px 0;
    }

    /* thinking indicator */
    .thinking {
      font-size: 12px;
      color: #374151;
      padding: 6px 0 10px 16px;
      border-left: 1px solid #1a2e1a;
      margin-left: 6px;
    }
    .thinking .dot-pulse {
      display: inline-block;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:1} }

    /* status */
    .status-bar {
      padding: 6px 24px;
      min-height: 26px;
      flex-shrink: 0;
    }
    #status {
      font-size: 11px;
      color: #854d0e;
      letter-spacing: 0.04em;
    }
    #status.sending { color: #fbbf24; }
    #status.error { color: #f87171; }

    /* input row */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px 16px;
      border-top: 1px solid #161616;
      flex-shrink: 0;
    }
    .input-sym {
      color: #22d3ee;
      font-size: 14px;
      flex-shrink: 0;
    }
    #prompt {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      caret-color: #22d3ee;
    }
    #prompt::placeholder { color: #1f2937; }

    .send-btn {
      background: transparent;
      border: 1px solid #1e2e1e;
      color: #4ade80;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #0f1f0f; border-color: #4ade80; }
    .send-btn:active { transform: scale(0.97); }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 13px;
      background: #22d3ee;
      animation: blink 1.1s step-end infinite;
      vertical-align: -2px;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <span class="header-title">// ollama chat interface</span>
      <span class="header-server">server: <span>192.168.86.241:11434</span></span>
    </div>

    <div class="term-window">

      <!-- title bar -->
      <div class="term-bar">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <span class="term-bar-title">ollama — llama3.2 — local</span>
        <span class="term-bar-model">llama3.2</span>
      </div>

      <!-- boot lines -->
      <div class="boot-section">
        <div class="boot-line"><span class="ok">[  OK  ]</span> Connected to ollama server</div>
        <div class="boot-line"><span class="ok">[  OK  ]</span> Model <span class="info">llama3.2</span> loaded</div>
        <div class="boot-line"><span class="dim">[------]</span> Session started: <span id="session-ts" class="dim"></span></div>
      </div>

      <!-- chat messages -->
      <div class="chat-log" id="chat"></div>

      <!-- status line -->
      <div class="status-bar">
        <span id="status"></span>
      </div>

      <!-- input -->
      <div class="input-row">
        <span class="input-sym">❯</span>
        <input type="text" id="prompt" placeholder="ask anything..." autocomplete="off" spellcheck="false" />
        <button class="send-btn" onclick="sendMessage()">SEND ↗</button>
      </div>

    </div>
  </div>

  <script>
    const SERVER = "http://192.168.86.241:11434";

    document.getElementById('session-ts').textContent = new Date().toLocaleString('en-AU', { hour12: false });

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function addMessage(role, content) {
      const chat = document.getElementById('chat');

      if (role === 'user') {
        const block = document.createElement('div');
        block.className = 'msg-block';
        block.innerHTML = `
          <div class="msg-prompt-line">
            <span class="sym">❯ </span><span class="cmd">${escHtml(content)}</span>
          </div>`;
        chat.appendChild(block);
      } else {
        const responseDiv = document.createElement('div');
        responseDiv.className = 'msg-response';

        const lines = String(content).split('\n');
        lines.forEach(rawLine => {
          const lineEl = document.createElement('div');
          if (!rawLine.trim()) {
            lineEl.style.height = '6px';
          } else {
            lineEl.className = role === 'error' ? 'msg-error-line' : 'msg-response-line';
            lineEl.textContent = rawLine;
          }
          responseDiv.appendChild(lineEl);
        });

        chat.appendChild(responseDiv);

        const divider = document.createElement('hr');
        divider.className = 'divider';
        chat.appendChild(divider);
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function addThinking() {
      const chat = document.getElementById('chat');
      const el = document.createElement('div');
      el.className = 'thinking';
      el.id = 'thinking-indicator';
      el.innerHTML = `<span class="dot-pulse">processing</span> <span class="cursor"></span>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeThinking() {
      const el = document.getElementById('thinking-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const promptEl = document.getElementById('prompt');
      const statusEl = document.getElementById('status');
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      promptEl.value = '';
      addMessage('user', prompt);
      addThinking();

      statusEl.className = 'sending';
      statusEl.textContent = 'transmitting...';

      try {
        const res = await fetch(`${SERVER}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: "llama3.2",
            messages: [{ role: "user", content: prompt }],
            stream: false
          })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        removeThinking();
        statusEl.textContent = '';
        statusEl.className = '';
        addMessage('assistant', data.message?.content || "No response.");
      } catch (err) {
        removeThinking();
        statusEl.className = 'error';
        statusEl.textContent = `error: ${err.message}`;
        addMessage('error', `✗ ${err.message}`);
      }
    }

    document.getElementById('prompt').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
