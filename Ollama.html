<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .chat-container { height: calc(100vh - 80px); }
    .message { max-width: 85%; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">

  <div class="flex h-screen">

    <!-- Sidebar -->
    <div class="w-72 bg-gray-900 border-r border-gray-700 flex flex-col">
      <div class="p-4">
        <button onclick="newChat()" 
                class="w-full bg-blue-600 hover:bg-blue-700 py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-medium">
          <i class="fas fa-plus"></i> New Chat
        </button>
      </div>
      
      <div class="px-4 text-xs text-gray-500 mb-2">Previous Chats</div>
      <div class="flex-1 overflow-y-auto px-2" id="chat-history">
        <!-- Will be populated by JS -->
      </div>

      <div class="p-4 border-t border-gray-700 text-sm">
        <div class="flex items-center gap-3 text-gray-400">
          <i class="fas fa-robot"></i>
          <span id="current-model">qwen2.5-coder:7b</span>
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col">
      <!-- Header -->
      <div class="h-14 border-b border-gray-700 bg-gray-900 flex items-center px-6">
        <h1 class="font-semibold text-lg">Website Design Assistant</h1>
      </div>

      <!-- Chat Messages -->
      <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container"></div>

      <!-- Input Area -->
      <div class="p-6 bg-gray-900 border-t border-gray-700">
        <div class="max-w-4xl mx-auto">
          <div class="flex gap-3">
            <input type="text" id="prompt" 
                   class="flex-1 bg-gray-800 border border-gray-600 rounded-2xl px-6 py-4 focus:outline-none focus:border-blue-500"
                   placeholder="Describe the website you want to build...">
            <button onclick="sendMessage()" 
                    class="bg-blue-600 hover:bg-blue-700 w-14 h-14 rounded-2xl flex items-center justify-center">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
          <p class="text-center text-xs text-gray-500 mt-3">Ollama is running locally • qwen2.5-coder:7b</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentChat = [];
    const chatDiv = document.getElementById('chat');
    const promptInput = document.getElementById('prompt');

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message`;
      
      div.innerHTML = `
        <div class="${role === 'user' ? 'bg-blue-600' : 'bg-gray-800'} px-5 py-3 rounded-2xl max-w-[80%]">
          ${content}
        </div>
      `;
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      addMessage('user', prompt);
      promptInput.value = '';

      const thinking = addMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('http://localhost:11434/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: "qwen2.5-coder:7b",
            messages: [{ role: "user", content: prompt }],
            stream: false
          })
        });

        const data = await res.json();
        thinking.remove();
        addMessage('assistant', data.message.content);
      } catch (err) {
        thinking.remove();
        addMessage('assistant', '❌ Could not connect to Ollama. Make sure it is running.');
      }
    }

    function newChat() {
      chatDiv.innerHTML = '';
      addMessage('assistant', 'Hello! How can I help you design a website today?');
    }

    // Allow Enter key to send
    promptInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Initialize with welcome message
    window.onload = () => {
      newChat();
    };
  </script>
</body>
</html>
